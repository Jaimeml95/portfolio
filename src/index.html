    <meta property="og:site_name" content="Portfolio" />

      content="Jaime Moro López · Desarrollador Full Stack Java"

    <meta
      property="og:description"
      content="Portfolio de Jaime Moro López, desarrollador full stack Java (Spring Boot y Angular). Proyectos, stack técnico y contacto."

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />

    <!-- Aplica el tema guardado antes del primer render para evitar parpadeo -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('portfolio-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <!-- Tipografía Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
